name: vybetech_project_jaylodha
description: "VybeCabs — Rider App Flutter Assignment"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  # Navigation
  go_router: ^14.3.0
  # Firebase Auth
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  # Storage & Fonts
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # fonts: (using google_fonts package instead)
