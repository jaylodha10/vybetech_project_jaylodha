<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="#1A1A2E" stroke="#FFD60A" stroke-width="3"/>
  
  <!-- Lightning bolt / V shape in yellow -->
  <!-- Left arm of V + lightning bolt combined -->
  <polygon points="28,28 52,72 44,72 62,92 68,92 46,52 54,52" fill="#FFD60A"/>
  <!-- Right arm of V -->
  <polygon points="92,28 68,72 76,72 60,50" fill="#FFD60A" opacity="0.9"/>
  
  <!-- Clean V shape -->
  <path d="M 25 25 L 52 82 L 60 72 L 68 82 L 95 25 L 85 25 L 60 68 L 35 25 Z" 
        fill="#FFD60A" 
        stroke="#1A1A2E" 
        stroke-width="1.5"
        stroke-linejoin="round"/>
  
  <!-- Dot below V (like exclamation) -->
  <circle cx="60" cy="96" r="4.5" fill="#FFD60A"/>
</svg>
